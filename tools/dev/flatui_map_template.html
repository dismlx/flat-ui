  svg.appendChild(eL);svg.appendChild(sL);svg.appendChild(nL);
  var gbx=h('div',{class:'graphbox',tabindex:0,role:'region','aria-label':'Module graph, scrolls sideways'},svg);
  frag.appendChild(gbx);
  var rows=a.modules.map(function(mid){var m=M[mid],o=0,i=0;
    m.links_out.forEach(function(l){o+=l.count});m.links_in.forEach(function(l){i+=l.count});
    return h('tr',null,h('td',null,modLink(mid)),h('td',{class:'num'},n(m.toc)),h('td',{class:'num'},n(m.lines)),
      h('td',{class:'num'},n(fnCount(m))),h('td',{class:'num'},n(ownedCount(m))),
      h('td',{class:'num'},n(o)),h('td',{class:'num'},n(i)))});
  frag.appendChild(h('div',{class:'scroll'},h('table',null,h('thead',null,h('tr',null,
    h('th',null,'Module'),h('th',{class:'num'},'TOC'),h('th',{class:'num'},'Lines'),h('th',{class:'num'},'Functions'),h('th',{class:'num'},'Settings owned'),h('th',{class:'num'},'Calls out'),h('th',{class:'num'},'Calls in'))),h('tbody',null,rows))));
  return frag}

function fmtDefault(s){
  var v=s.default;
  if(s.kind==='bool')return v?'On':'Off';
  if(s.kind==='colour'&&typeof v==='string'&&v.length===8){
    return[h('span',{class:'swatch',style:'background:#'+v.slice(2)}),'#'+v.slice(2)+(v.slice(0,2)!=='ff'?', alpha '+v.slice(0,2):'')]}
  if(s.kind==='choice'&&Array.isArray(s.choices)){
    for(var i=0;i<s.choices.length;i++)if(s.choices[i][0]===v)return s.choices[i][1]}
  if(s.kind==='list')return 'Empty list';
  if(v!==null&&typeof v==='object')return JSON.stringify(v);
  return String(v)}
function fmtChoices(s){
  if(s.kind==='bool')return'On or off';
  if(s.kind==='number'&&s.range)return s.range.min+' to '+s.range.max+', step '+s.range.step;
  if(Array.isArray(s.choices)){var l=s.choices.map(function(c){return c[1]});
    return l.length>8?l.slice(0,8).join(', ')+' and '+(l.length-8)+' more':l.join(', ')}
  if(typeof s.choices==='string')return'From '+s.choices;
  if(s.kind==='colour')return'Colour';
  return''}
function settingCells(s,q,withOwner){
  var cells=[
    h('td',null,h('div',null,markText(s.label,q||'')),h('div',{class:'muted small'},s.page_label+(s.section?' / '+s.section:'')),h('div',{class:'mono muted'},s.path)),
    h('td',null,fmtDefault(s)),
    h('td',{class:'small'},fmtChoices(s)),
    h('td',{class:'small'},s.tip||'',(s.needs?h('div',{class:'muted'},'Needs '+neededLabel(s)):null),(s.cvar?h('div',{class:'muted'},'CVar '+s.cvar):null))];
  if(withOwner){var o=OWNER[s.path];cells.push(h('td',null,o?modLink(o):'',(s.shared_with?h('div',{class:'muted small'},'Also in '+plural(s.shared_with,'other file')):null)))}
  return h('tr',null,cells)}

function moduleView(id,opts){
  var m=M[id],a=A[m.area];
  document.getElementById('ttl').textContent=id;
  setCrumbs([{text:'Flat UI',token:''},{text:a.label,token:m.area},{text:id}]);
  var frag=h('div');
  var nOwn=ownedCount(m),nUse=m.settings.length-nOwn;
  var gameTotal=0;GROUPS.forEach(function(g){gameTotal+=(m.game[g[0]]||[]).length});
  var linkOut=m.links_out.length,linkIn=m.links_in.length;
  var isConfig=!m.settings.length&&m.id==='Config';
  frag.appendChild(h('p',{class:'sub mono'},m.file));
  frag.appendChild(h('ul',{class:'facts'},
    h('li',null,'TOC position ',h('b',null,m.toc),' of '+S.files),
    h('li',null,h('b',null,n(m.lines)),' lines'),
    h('li',null,h('b',null,n(fnCount(m))),fnCount(m)===1?' function':' functions'),
    h('li',null,h('b',null,n(nOwn)),nOwn===1?' setting owned':' settings owned'),
    h('li',null,'Area ',link(a.label,m.area))));
  frag.appendChild(h('div',{class:'panel',id:'sec-about'},h('h2',null,'Description'),
    m.description.split(/\n+/).map(function(p){return h('p',{class:'p'},p)})));

  var fnRows=m.functions.map(function(f){return{name:f.name,kind:f.kind,line:f.line,end:f.end||f.line,args:f.args||'',doc:f.doc||''}});
  m.ns_functions.forEach(function(f){if(f.kind!=='function')fnRows.push({name:f.name,kind:'ns '+(f.kind==='declare'?'table':f.kind),line:f.line,end:f.line,args:'',doc:''})});
  fnRows.sort(function(x,y){return x.line-y.line});
  var navs=[['functions','Functions',fnRows.length],['settings','Settings',isConfig?S.settings:m.settings.length],['game','Game parts',gameTotal],
    ['links','Calls',linkOut+linkIn],['tests','Tests',((m.tests&&((m.tests.key_labels||[]).length+(m.tests.ref_labels||[]).length))||0)]];
  var nav=h('div',{class:'nav',role:'navigation','aria-label':'Sections'},navs.map(function(x){
    return h('button',{class:'btn',type:'button',onclick:function(){jump(x[0])}},x[1],h('span',null,n(x[2])))}));
  frag.appendChild(nav);
  function jump(sec){var e=document.getElementById('sec-'+sec);if(e){e.scrollIntoView({block:'start'});var hd=e.querySelector('h2');if(hd){hd.tabIndex=-1;hd.focus({preventScroll:true})}}}
  var q0=(opts&&opts.q)||'';

  var fp=h('section',{class:'panel',id:'sec-functions'},h('h2',null,'Functions'));
  if(!fnRows.length)fp.appendChild(h('p',{class:'muted'},'No functions.'));
  else{
    var fq=h('input',{type:'search','aria-label':'Filter functions',placeholder:'Filter functions',value:opts&&opts.section==='functions'?q0:''});
    var kc={};fnRows.forEach(function(f){kc[f.kind]=(kc[f.kind]||0)+1});
    var ks=Object.keys(kc).sort(function(x,y){return kc[y]-kc[x]});
    var ksel=h('select',{'aria-label':'Kind of function'},h('option',{value:''},'All kinds ('+n(fnRows.length)+')'),
      ks.map(function(k){return h('option',{value:k},(KIND[k]||k)+' ('+n(kc[k])+')')}));
    var fbox=h('div'),fall=false;
    fp.appendChild(h('div',{class:'ctl'},fq,ksel));
    fp.appendChild(fbox);
    var drawF=function(){
      var q=fq.value.trim().toLowerCase(),kk=ksel.value;
      var list=fnRows.filter(function(f){return(!kk||f.kind===kk)&&(!q||f.name.toLowerCase().indexOf(q)>=0)});
      var lim=fall?list.length:80;
      fbox.textContent='';
      fbox.appendChild(h('div',{class:'scroll'},h('table',null,h('thead',null,h('tr',null,h('th',null,'Name'),h('th',null,'Kind'),h('th',{class:'num'},'Lines'),h('th',null,'Comment above'))),
        h('tbody',null,list.slice(0,lim).map(function(f){return h('tr',null,
          h('td',null,h('span',{class:'mono'},markText(f.name,q)),f.args?h('span',{class:'mono muted'},'('+f.args+')'):null),
          h('td',{class:'nowrap small'},KIND[f.kind]||f.kind),
          h('td',{class:'num'},f.end>f.line?f.line+' to '+f.end:String(f.line)),
          h('td',{class:'small'},f.doc))})))));
      if(!list.length)fbox.appendChild(h('p',{class:'muted'},'No matches.'));
      if(list.length>lim)fbox.appendChild(h('p',null,h('button',{class:'btn',type:'button',onclick:function(){fall=true;drawF()}},'Show all '+n(list.length))))};
    fq.addEventListener('input',function(){fall=false;drawF()});
    ksel.addEventListener('change',function(){fall=false;drawF()});
    if(q0&&opts.section==='functions')fall=true;
    drawF()}
  frag.appendChild(fp);

  var sp=h('section',{class:'panel',id:'sec-settings'},h('h2',null,'Settings'));
  if(isConfig){
    sp.appendChild(h('p',{class:'p'},'Config.lua defines '+plural(S.settings,'setting')+' on '+plural(S.settings_pages,'page')+'. Each setting is listed under the module that owns it. ',link('Settings pages','pages'),' lists them by page.'))}
  else if(!m.settings.length)sp.appendChild(h('p',{class:'muted'},'No settings.'));
  else{
    var role=h('select',{'aria-label':'Settings to show'},
      h('option',{value:'owns'},'Owned ('+n(nOwn)+')'),h('option',{value:'uses'},'Used only ('+n(nUse)+')'),h('option',{value:'all'},'All ('+n(m.settings.length)+')'));
    role.value=(nOwn>0&&!(opts&&opts.section==='settings'&&q0))?'owns':'all';
    var sq=h('input',{type:'search','aria-label':'Filter settings',placeholder:'Filter settings',value:opts&&opts.section==='settings'?q0:''});
    var sbox=h('div'),sall=false;
    sp.appendChild(h('div',{class:'ctl'},sq,role));
    sp.appendChild(sbox);
    var drawS=function(){
      var q=sq.value.trim().toLowerCase(),r=role.value;
      var list=m.settings.filter(function(s){
        if(r!=='all'&&s.role!==r)return false;
        return!q||(s.label+' '+s.path+' '+s.page_label+' '+s.section+' '+(s.tip||'')).toLowerCase().indexOf(q)>=0});
      var lim=sall?list.length:100;
      sbox.textContent='';
      sbox.appendChild(h('div',{class:'scroll'},h('table',null,
        h('thead',null,h('tr',null,h('th',null,'Setting'),h('th',null,'Default'),h('th',null,'Choices or range'),h('th',null,'Tip'))),
        h('tbody',null,list.slice(0,lim).map(function(s){return settingCells(s,q,false)})))));
      if(!list.length)sbox.appendChild(h('p',{class:'muted'},'No matches.'));
      if(list.length>lim)sbox.appendChild(h('p',null,h('button',{class:'btn',type:'button',onclick:function(){sall=true;drawS()}},'Show all '+n(list.length))))};
    sq.addEventListener('input',function(){sall=false;drawS()});
    role.addEventListener('change',function(){sall=false;drawS()});
    if(opts&&opts.section==='settings'&&q0)sall=true;
    drawS()}
  frag.appendChild(sp);

  var gp=h('section',{class:'panel',id:'sec-game'},h('h2',null,'Game parts'));
  if(!gameTotal)gp.appendChild(h('p',{class:'muted'},'No game parts found.'));
  GROUPS.forEach(function(gr){
    var list=m.game[gr[0]]||[];if(!list.length)return;
    var hasQ=opts&&opts.section==='game'&&q0&&list.some(function(x){return x.name===q0});
    var det=h('details',{open:hasQ||list.length<=12||null},h('summary',null,gr[1],h('span',null,n(list.length)+(list.length===1?' name':' names'))));
    var sorted=list.slice().sort(function(x,y){return(x.name===q0?-1:0)-(y.name===q0?-1:0)||y.count-x.count});
    det.appendChild(h('div',{class:'scroll'},h('table',null,h('thead',null,h('tr',null,h('th',null,'Name'),h('th',{class:'num'},'Uses'),h('th',null,'Where'))),
      h('tbody',null,sorted.slice(0,80).map(function(x){
        var note=[];
        if(x.via)note.push(viaText(x.via));
        if(x.handler)note.push('Handler '+x.handler);
        if(x.receivers)note.push('Object '+x.receivers);
        return h('tr',null,h('td',{class:'mono'},x.name),h('td',{class:'num'},x.count),
          h('td',null,examples(x.lines,x.code,x.fns,id),note.length?h('div',{class:'small muted'},note.join('. ')):null))})))));
    if(sorted.length>80)det.appendChild(h('p',{class:'muted small'},'First 80 of '+n(sorted.length)+' by uses.'));
    gp.appendChild(det)});
  if(m.events_dynamic)gp.appendChild(h('p',{class:'muted small'},plural(m.events_dynamic,'event')+' registered by a name built while the game runs.'));
  frag.appendChild(gp);

  var lp=h('section',{class:'panel',id:'sec-links'},h('h2',null,'Calls'));
  function linkTable(title,list,dir){
    var det=h('div',{style:'margin-top:8px'},h('h3',null,title,h('span',{class:'muted',style:'font-weight:400'},' '+plural(list.length,'module')+', '+plural(list.reduce(function(s,l){return s+l.count},0),'call'))));
    if(!list.length){det.appendChild(h('p',{class:'muted'},'None.'));return det}
    var sorted=list.slice().sort(function(x,y){return y.count-x.count});
    det.appendChild(h('div',{class:'scroll'},h('table',null,h('thead',null,h('tr',null,h('th',null,'Module'),h('th',{class:'num'},'Calls'),h('th',null,'Functions'),h('th',null,'Where'))),
      h('tbody',null,sorted.map(function(l){var other=dir==='out'?l.to:l.from,tgt=dir==='out'?l.to:id;
        return h('tr',null,h('td',null,modLink(other)),h('td',{class:'num'},l.count),
          h('td',null,chips(l,tgt)),
          h('td',null,examples(l.examples,l.code,l.fns,l.from)))})))));
    return det}
  lp.appendChild(linkTable('Calls out of '+id,m.links_out,'out'));
  lp.appendChild(linkTable('Calls into '+id,m.links_in,'in'));
  frag.appendChild(lp);

  var tp=h('section',{class:'panel',id:'sec-tests'},h('h2',null,'Tests'));
  var t=m.tests||{};
  var tl=(t.key_labels||[]).map(function(i){return{i:i,why:'Prefix names this module'}}).concat((t.ref_labels||[]).map(function(i){return{i:i,why:'Calls a function of this module'}}));
  if(!tl.length)tp.appendChild(h('p',{class:'muted'},'No test labels for this module.'));
  else{
    var tq=h('input',{type:'search','aria-label':'Filter test labels',placeholder:'Filter test labels'});
    var tbox=h('div'),tall=false;
    tp.appendChild(h('div',{class:'ctl'},tq,h('span',{class:'muted small'},plural(tl.length,'test label'))));
    tp.appendChild(tbox);
    var drawT=function(){
      var q=tq.value.trim().toLowerCase();
      var list=tl.filter(function(x){return!q||D.test_labels[x.i][0].toLowerCase().indexOf(q)>=0});
      var lim=tall?list.length:100;
      tbox.textContent='';
      tbox.appendChild(h('div',{class:'scroll'},h('table',null,h('thead',null,h('tr',null,h('th',null,'Label'),h('th',null,'Why listed'),h('th',{class:'num'},'Line'))),
        h('tbody',null,list.slice(0,lim).map(function(x){var lab=D.test_labels[x.i];
          return h('tr',null,h('td',{class:'mono'},markText(lab[0],q)),h('td',{class:'small muted'},x.why),h('td',{class:'num'},lab[1]))})))));
      if(!list.length)tbox.appendChild(h('p',{class:'muted'},'No matches.'));
      if(list.length>lim)tbox.appendChild(h('p',null,h('button',{class:'btn',type:'button',onclick:function(){tall=true;drawT()}},'Show all '+n(list.length))))};
    tq.addEventListener('input',function(){tall=false;drawT()});
    drawT();
    if((t.top_prefixes||[]).length)tp.appendChild(h('div',{class:'scroll'},h('table',null,h('thead',null,h('tr',null,h('th',null,'Label prefix'),h('th',{class:'num'},'Labels'))),
      h('tbody',null,t.top_prefixes.map(function(p){return h('tr',null,h('td',{class:'mono'},p.prefix),h('td',{class:'num'},n(p.labels)))})))))}
  frag.appendChild(tp);
  return{node:frag,section:opts&&opts.section,jump:jump}}

function pagesView(){
  document.getElementById('ttl').textContent='Settings pages';
  setCrumbs([{text:'Flat UI',token:''},{text:'Settings pages'}]);
  var frag=h('div');
  frag.appendChild(h('ul',{class:'facts'},h('li',null,h('b',null,n(S.settings_pages)),' pages'),h('li',null,h('b',null,n(S.settings)),' settings')));
  var rows=D.settings_pages.map(function(p){
    var ow=PAGEOWNERS[p.key]||{},names=Object.keys(ow).sort(function(x,y){return ow[y]-ow[x]});
    return h('tr',null,
      h('td',null,p.parent&&PAGE[p.parent]?h('span',{class:'muted'},PAGE[p.parent].label+' / '):null,link(p.label,'page:'+p.key)),
      h('td',{class:'num'},n(p.rows)),
      h('td',null,h('div',{class:'chips'},names.slice(0,6).map(function(o){return link(o+(ow[o]>1?' '+ow[o]:''),o,'chip')}),names.length>6?h('span',{class:'muted small'},'+'+(names.length-6)+' more'):null)))});
  frag.appendChild(h('div',{class:'scroll'},h('table',null,h('thead',null,h('tr',null,h('th',null,'Page'),h('th',{class:'num'},'Settings'),h('th',null,'Owning modules'))),h('tbody',null,rows))));
  return frag}
function pageView(key){
  var p=PAGE[key];
  document.getElementById('ttl').textContent=p.label;
  setCrumbs([{text:'Flat UI',token:''},{text:'Settings pages',token:'pages'},{text:p.label}]);
  var frag=h('div');
  var rows=PAGEROWS[key]||[];
  frag.appendChild(h('ul',{class:'facts'},h('li',null,h('b',null,n(rows.length)),rows.length===1?' setting':' settings'),
    p.parent&&PAGE[p.parent]?h('li',null,'Under ',link(PAGE[p.parent].label,'page:'+p.parent)):null));
  var q=h('input',{type:'search','aria-label':'Filter settings',placeholder:'Filter settings'});
  var box=h('div');
  frag.appendChild(h('div',{class:'ctl'},q));
  frag.appendChild(box);
  function draw(){
    var t=q.value.trim().toLowerCase();
    var list=rows.filter(function(s){return!t||(s.label+' '+s.path+' '+(s.section||'')+' '+(s.tip||'')).toLowerCase().indexOf(t)>=0});
    box.textContent='';
    box.appendChild(h('div',{class:'scroll'},h('table',null,
      h('thead',null,h('tr',null,h('th',null,'Setting'),h('th',null,'Default'),h('th',null,'Choices or range'),h('th',null,'Tip'),h('th',null,'Owner'))),
      h('tbody',null,list.map(function(s){return settingCells(s,t,true)})))));
    if(!list.length)box.appendChild(h('p',{class:'muted'},'No matches.'))}
  q.addEventListener('input',draw);draw();
  return frag}

function render(){
  var r=parse();main.textContent='';
  var out,after=null;
  if(r.v==='area')out=areaView(r.id);
  else if(r.v==='module'){var mv=moduleView(r.id,pending);out=mv.node;after=mv}
  else if(r.v==='pages')out=pagesView();
  else if(r.v==='page')out=pageView(r.id);
  else out=overview();
  main.appendChild(out);
  document.title='Flat UI map';
  document.getElementById('sub').textContent=r.v==='overview'?'Build '+S.version+', '+plural(S.files,'file')+', '+n(S.lines)+' lines, '+plural(S.functions,'function')+', '+plural(S.settings,'setting')+' on '+plural(S.settings_pages,'page')+', '+plural(S.link_uses,'call')+' between files':
    '';
  window.scrollTo(0,0);
  var ttl=document.getElementById('ttl');
  if(!first&&!(pending&&pending.section))ttl.focus({preventScroll:true});
  if(after&&pending&&pending.section)setTimeout(function(){after.jump(pending.section);pending=null},0);
  else pending=null;
  first=false}
render();
})();
</script>
