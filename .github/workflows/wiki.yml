name: Wiki

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Publish the wiki folder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --depth 1 "$url" site 2>/dev/null; then
            echo "::error::The wiki has no pages yet. Open the Wiki tab of the repository, press Create the first page, save it, then run this workflow again from the Actions tab."
            exit 1
          fi
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r wiki/. site/
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git commit -q -m "Wiki from ${GITHUB_SHA::7}"
          git push -q origin HEAD
          echo "Published $(ls *.md | wc -l) pages."
